[package]
name = "credhop"
version = "0.3.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.89"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
# Pinned: `unstable-dynamic` has no compatibility guarantees and `cargo install` ignores Cargo.lock.
clap_complete = { version = "=4.6.11", features = ["unstable-dynamic"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }

[dev-dependencies]
tempfile = "3.27.0"
